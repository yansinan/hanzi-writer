<!DOCTYPE html>
<html lang="en-us">
	<head>
		<meta charset="utf-8">
		<title>Hanzi Writer</title>
		<!-- <link href='http://fonts.googleapis.com/css?family=Raleway' rel='stylesheet' type='text/css'> -->
		<link rel="stylesheet" href="styles.css" />
		<script src="https://cdn.polyfill.io/v2/polyfill.min.js"></script>
	</head>
	<body>

		<h1 class="title">Hanzi Writer</h1>
		<form class="js-char-form char-form">
			<label>
				Character
				<input type="text" class="js-char char-input" size="2" maxlength="10" value="我" />
			</label>
			<!-- 移除提交按钮 -->
		</form>
		<div class="actions">
			<button class="js-toggle">Show/hide</button>
			<button class="js-toggle-hint">Outline on/off</button>
			<button class="js-animate">Animate</button>
		</div>

		<div id="target">
			 <!-- 背景通过外部 SVG 文件加载 -->
		</div>
		
		<!-- <script src="https://cdn.polyfill.io/v2/polyfill.min.js"></script> -->
		<!-- <script type="application/javascript" src="../dist/hanzi-writer.js"></script> -->
		<!-- <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script> -->
		<script src="https://unpkg.com/hanzi-writer@3.0.3/dist/hanzi-writer.min.js"></script>
		<script type="application/javascript" src="test.js"></script>

	</body>
</html>
