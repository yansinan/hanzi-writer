
<html lang="en-us">
	<head>
		<meta charset="utf-8">
		<title>Hanzi Writer</title>

		<link rel="stylesheet" href="styles.css" />

	</head>
	<body>

		<h1 class="title">Hanzi Writer V0.01</h1>
		<form class="js-char-form char-form">
			<label>
				格子大小
				<input type="text" class="js-char-size char-size" size="2" maxlength="2" value="100" />
				px
			</label>

			<label>
				Character
				<input type="text" class="js-char char-input" size="50" maxlength="100" value="每个 格子 创建 为 雪 学 习 " />
			</label>
			<!-- 移除提交按钮 -->
		</form>
		<div class="actions">
			<button class="js-toggle">Show/hide</button>
			<button class="js-toggle-hint">Outline on/off</button>
			<button class="js-animate">Animate</button>
		</div>

		<div id="target">
			 <!-- 背景通过外部 SVG 文件加载 -->
		</div>
